name: Holiday Cache Workflow

on:
  schedule:
    - cron: '0 21 * * *'  # Her gün UTC 21:00 = Türkiye 00:00 (gece yarısı)
  workflow_dispatch:  # Manuel tetikleme için

jobs:
  cache-holidays:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install holidays

      - name: Cache Holiday Data
        run: python holiday_cache.py

      - name: Verify cache was updated
        run: |
          TODAY=$(date -u '+%Y-%m-%d')
          CACHE_DATE=$(python -c "import json; d=json.load(open('holiday_cache.json')); print(d['cache_date'])")
          if [ "$CACHE_DATE" != "$TODAY" ]; then
            echo "HATA: Cache tarihi ($CACHE_DATE) bugünle ($TODAY) eşleşmiyor!"
            exit 1
          fi
          echo "Cache doğrulandı: $CACHE_DATE"

      - name: Commit and push holiday cache
        run: |-
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add holiday_cache.json
          timestamp=$(date '+%Y-%m-%d')
          git diff --staged --quiet && echo "Değişiklik yok, commit atlanıyor." && exit 0
          git commit -m "🗓️ Holiday cache update ${timestamp}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
