name: Asgari Ucret Tweet Workflow

on:
  schedule:
    - cron: '30 5 * * 1,3,5'  # Pazartesi, Çarşamba, Cuma 08:30 Türkiye saati (UTC+3)
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        run: python asgari.py
        env:
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          EXCHANGE_RATES_API_KEY_1: ${{ secrets.EXCHANGE_RATES_API_KEY_1 }}
          EXCHANGE_RATES_API_KEY_2: ${{ secrets.EXCHANGE_RATES_API_KEY_2 }}
          EXCHANGE_RATES_API_KEY_3: ${{ secrets.EXCHANGE_RATES_API_KEY_3 }}
          EXCHANGE_RATES_API_KEY_4: ${{ secrets.EXCHANGE_RATES_API_KEY_4 }}

      - name: Commit and push changes
        run: |-
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          timestamp=$(date '+%Y-%m-%d %H:%M:%S')
          git commit -m "Update Data ${timestamp}" || exit 0
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
