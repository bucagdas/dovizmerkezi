name: Tweet Workflow

on:
  workflow_dispatch:
    inputs:
      event:
        description: 'Borsa olayı/olayları, virgülle (ör. london_open veya turkiye_open,shanghai_close). Boş bırakılırsa özel mesaj/görsel uygulanmaz.'
        required: false
        default: ''
      sched:
        description: 'Planlanan UTC saati HH:MM (tweet metnindeki saati göstermek için).'
        required: false
        default: ''

jobs:
  tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run the Python script
      - name: Run Script
        run: python dovizmerkezi.py
        env:
          MARKET_EVENT: ${{ github.event.inputs.event }}
          SCHED_TIME: ${{ github.event.inputs.sched }}
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          EXCHANGE_RATES_API_KEY_1: ${{ secrets.EXCHANGE_RATES_API_KEY_1 }}
          EXCHANGE_RATES_API_KEY_2: ${{ secrets.EXCHANGE_RATES_API_KEY_2 }}
          EXCHANGE_RATES_API_KEY_3: ${{ secrets.EXCHANGE_RATES_API_KEY_3 }}
          EXCHANGE_RATES_API_KEY_4: ${{ secrets.EXCHANGE_RATES_API_KEY_4 }}
          CALENDARIFIC_API_KEY: ${{ secrets.CALENDARIFIC_API_KEY }}

      # Commit and push changes
      - name: Commit and push changes
        run: |-
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          timestamp=$(date '+%Y-%m-%d %H:%M:%S')
          git commit -m "Update Data ${timestamp}" || exit 0
          # Aynı UTC dakikada birden çok borsa olayı olabildiğinden (ör. 07:00'de
          # Türkiye açılışı + Şangay kapanışı) eşzamanlı push'lar çakışabilir;
          # rebase ederek birkaç kez dene.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break || sleep 4
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
